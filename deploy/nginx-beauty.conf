# /etc/nginx/sites-available/beauty.behlulalar.online
# Aurora vitrini + paneli. Tum istekler 127.0.0.1:18310'daki Next.js'e gider;
# /api ve /uploads'i Next kendi icinde backend'e yonlendirir.
server {
    listen 80;
    listen [::]:80;
    server_name beauty.behlulalar.online;

    location /.well-known/acme-challenge/ {
        root /var/www/beauty-acme;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beauty.behlulalar.online;

    ssl_certificate     /etc/letsencrypt/live/beauty.behlulalar.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beauty.behlulalar.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Portfolyo / tasarim gorseli yuklemeleri
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:18310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
